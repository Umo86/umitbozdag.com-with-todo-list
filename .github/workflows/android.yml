# Builds the Backstage Android app on every update that goes live (push to
# main) and publishes it as the "android-latest" release, so the newest APK
# is always at umitbozdag.com/app (button) and at:
# https://github.com/Umo86/umitbozdag.com-with-todo-list/releases/download/android-latest/Backstage.apk
# The release notes come from the newest entry in lib/changelog.json.
name: Android app

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "test/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install and sync the app
        working-directory: mobile
        env:
          # Firebase config for push notifications (optional): see mobile/prepare.mjs
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          npm ci --no-audit --no-fund
          node prepare.mjs
          npx cap sync android

      - name: Load the signing key (if set up)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/backstage.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/backstage.jks" >> "$GITHUB_ENV"
            echo "::add-mask::$KEYSTORE_PASSWORD"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No signing key set: using a debug key (each new APK must replace the old one by uninstalling first)."
          fi

      - name: Build the APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Publish the APK
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk Backstage.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release delete android-build-log --yes --cleanup-tag || true
          node -e '
            const c = require("./lib/changelog.json")[0] || { title: "Update", items: [] };
            const lines = [`Build ${process.env.VERSION_CODE} · ${c.title}`, "", ...c.items.map((i) => "- " + i), "", `From ${process.env.GITHUB_SHA.slice(0, 7)}. Download Backstage.apk on your phone and open it to install.`];
            require("fs").writeFileSync("notes.md", lines.join("\n"));
          '
          gh release create android-latest Backstage.apk \
            --title "Backstage for Android · build ${VERSION_CODE}" \
            --notes-file notes.md \
            --prerelease --target "$GITHUB_SHA"

      - name: Publish the build log (failed builds only)
        if: failure()
        run: |
          touch build.log
          gh release delete android-build-log --yes --cleanup-tag || true
          gh release create android-build-log build.log \
            --title "Android build log (failed)" \
            --notes "Build ${VERSION_CODE} from ${GITHUB_SHA::7} failed." \
            --prerelease --target "$GITHUB_SHA"
