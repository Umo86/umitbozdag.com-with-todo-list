<!doctype html>
<!-- The hero film: an illustrated journey through every city on the site's
     map, each in its country's colours, drawn on one canvas. draw(t) is deterministic and loops
     seamlessly after DURATION seconds; render.py films it frame by frame. -->
<meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="c" width="1280" height="720"></canvas>
<script>
"use strict";
const W = 1280, H = 720, HORIZON = 548, TAU = Math.PI * 2;
const GAP = 1500;            // world distance between city centres
const DWELL = 2.4, TRAVEL = 3.4, SEG = DWELL + TRAVEL;
const DRIFT = 36;            // the camera never stops: it drifts at this speed (px/s) while a city is in view
const ORDER = ["London", "Dublin", "Rotterdam", "Milan", "Istanbul", "New Delhi", "Bangkok", "Cape Town", "Houston"];
const N = ORDER.length, DURATION = N * SEG;
const CX = 760;              // where a city's centre sits on screen (right of the name)

// Each city has its own colours and sky, taken from the country; they blend
// into the next city's while the camera travels.
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const T = (skyTop, skyMid, skyLow, horizon, far, mid, near, light, waterTop, water, stars, sky) =>
  ({ skyTop: hex(skyTop), skyMid: hex(skyMid), skyLow: hex(skyLow), horizon: hex(horizon), far: hex(far), mid: hex(mid), near: hex(near), light, waterTop: hex(waterTop), water: hex(water), stars, sky });
const THEMES = {
  // royal blue night, full moon
  London: T("#020512", "#061a52", "#0d3fd1", "#3f74ff", "#0b2068", "#07133d", "#040a22", [210, 226, 255], "#0a2a8f", "#040d2e", 1, { kind: "moon", x: 980, y: 150, r: 26, rgb: [236, 242, 255] }),
  // emerald
  Dublin: T("#010d0b", "#053b2c", "#0a8a57", "#52d690", "#0a4a36", "#062a20", "#031410", [214, 255, 226], "#0b6a48", "#04201a", 0.9, { kind: "moon", x: 1010, y: 130, r: 22, rgb: [226, 255, 236] }),
  // Dutch orange dusk
  Rotterdam: T("#0b0a24", "#3a1d4d", "#c9541c", "#ffa63f", "#5a2a3a", "#2a1430", "#120a1c", [255, 226, 180], "#8a3a22", "#1a0d20", 0.45, { kind: "sun", x: 1040, y: 492, r: 46, rgb: [255, 196, 110] }),
  // rose and gold evening
  Milan: T("#100818", "#4a1838", "#b83a5a", "#ffb37a", "#5a2040", "#2e1028", "#150816", [255, 232, 205], "#7a2a48", "#1c0a1e", 0.6, { kind: "moon", x: 1000, y: 120, r: 18, rgb: [255, 236, 220] }),
  // crimson, crescent and star
  Istanbul: T("#12030a", "#5a0a1e", "#c8102e", "#ff6a4a", "#5a1024", "#300814", "#16040a", [255, 225, 200], "#8a1024", "#1e060e", 0.7, { kind: "crescent", x: 985, y: 150, r: 34, rgb: [255, 244, 236] }),
  // saffron dawn, big low sun
  "New Delhi": T("#1a0c2a", "#6a2a4a", "#e8781e", "#ffc24a", "#7a3a3a", "#3a1a2a", "#1a0c16", [255, 236, 190], "#a0501e", "#22101a", 0.3, { kind: "sun", x: 990, y: 400, r: 74, rgb: [255, 206, 96] }),
  // gold on violet
  Bangkok: T("#0c0424", "#34106a", "#8a2aa8", "#ffb84a", "#3e1a66", "#220c40", "#100620", [255, 214, 130], "#5a1e80", "#140828", 0.8, { kind: "moon", x: 990, y: 140, r: 30, rgb: [255, 226, 150] }),
  // coral sunset over a teal sea
  "Cape Town": T("#06202e", "#2f4a70", "#f0705a", "#ffc07a", "#0e2c3a", "#0c2a38", "#06141c", [255, 234, 210], "#0e6a72", "#06202a", 0.4, { kind: "sun", x: 1068, y: 366, r: 42, rgb: [255, 190, 120] }),
  // Texas dusk: navy over red
  Houston: T("#03051a", "#0e1650", "#6a2040", "#e8553a", "#2a2050", "#14102e", "#0a0818", [255, 238, 200], "#5a2030", "#0c0a1c", 1, { kind: "moon", x: 960, y: 160, r: 22, rgb: [255, 244, 226] }),
};
const mix = (a, b, w) => [a[0] + (b[0] - a[0]) * w, a[1] + (b[1] - a[1]) * w, a[2] + (b[2] - a[2]) * w];
const css = (c, a) => a === undefined ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const C = {};
function palette(a, b, w) {
  for (const k of ["skyTop", "skyMid", "skyLow", "horizon", "far", "mid", "near", "waterTop", "water"]) C[k] = css(mix(a[k], b[k], w));
  const l = mix(a.light, b.light, w); C.light = `${l[0] | 0},${l[1] | 0},${l[2] | 0}`;
  C.deep = css(mix(mix(a.water, b.water, w), [0, 0, 0], 0.72));
  C.cloud = mix(mix(a.near, b.near, w), [0, 0, 0], 0.15);
  C.stars = a.stars + (b.stars - a.stars) * w;
}
const ctx = document.getElementById("c").getContext("2d");

function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const glide = (p) => p <= 0 ? 0 : p >= 1 ? 1 : p * p * p * (p * (p * 6 - 15) + 10); // no jolt at either end
const loop = (t, k = 1, ph = 0) => Math.sin(TAU * (k * t / DURATION + ph)); // periodic over the film
const travel = (t) => { const i = Math.floor(t / SEG), u = t - i * SEG; return { i, w: glide((u - DWELL) / TRAVEL) }; };

function camera(t) {
  const { i, w } = travel(t), u = t - i * SEG;
  return i * GAP + DRIFT * (u - DWELL / 2) + (GAP - DRIFT * SEG) * w;
}

// ——— drawing helpers: x from the city centre, y up from the waterline ———
let ox = 0;                                    // screen x of the current city's centre
const X = (x) => ox + x, Y = (y) => HORIZON - y;
function box(x, w, h, y0 = 0) { ctx.fillRect(X(x - w / 2), Y(y0 + h), w, h); }
function poly(pts) { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y))); ctx.closePath(); ctx.fill(); }
function line(pts, w) { ctx.lineWidth = w; ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y))); ctx.stroke(); }
function disc(x, y, r) { ctx.beginPath(); ctx.arc(X(x), Y(y), r, 0, TAU); ctx.fill(); }
function dome(x, y, r, squash = 1) { ctx.beginPath(); ctx.ellipse(X(x), Y(y), r, r * squash, 0, Math.PI, 0); ctx.closePath(); ctx.fill(); }
function lights(x, y0, w, h, cols, rows, seed, t, size = 3) {
  const r = rng(seed);
  for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
    const on = r(), ph = r();
    if (on < 0.42) continue;
    const a = 0.45 + 0.4 * on + 0.15 * loop(t, 6 + Math.floor(ph * 5), ph);
    ctx.fillStyle = `rgba(${C.light},${Math.max(0.15, Math.min(1, a)).toFixed(2)})`;
    ctx.fillRect(X(x - w / 2 + (i + 0.5) * w / cols) - size / 2, Y(y0 + (j + 0.5) * h / rows) - size / 2, size, size * 1.4);
  }
}
const ink = (c) => { ctx.fillStyle = c; ctx.strokeStyle = c; };
const glow = (a = 0.9) => { ctx.fillStyle = `rgba(${C.light},${a})`; ctx.strokeStyle = `rgba(${C.light},${a})`; };

function wheel(x, y, r, t, turns, pods) {
  ink(C.near); line([[x - r * 0.42, 0], [x, y], [x + r * 0.42, 0]], Math.max(4, r * 0.05));
  ctx.strokeStyle = `rgba(${C.light},.85)`; ctx.lineWidth = Math.max(2, r * 0.028);
  ctx.beginPath(); ctx.arc(X(x), Y(y), r, 0, TAU); ctx.stroke();
  const a0 = TAU * turns * t / DURATION;
  ctx.strokeStyle = `rgba(${C.light},.4)`; ctx.lineWidth = 1;
  for (let k = 0; k < pods; k++) { const a = a0 + k * TAU / pods; ctx.beginPath(); ctx.moveTo(X(x), Y(y)); ctx.lineTo(X(x) + Math.cos(a) * r, Y(y) + Math.sin(a) * r); ctx.stroke(); }
  glow(0.95);
  for (let k = 0; k < pods; k++) { const a = a0 + k * TAU / pods; ctx.beginPath(); ctx.ellipse(X(x) + Math.cos(a) * r, Y(y) + Math.sin(a) * r, r * 0.05, r * 0.035, 0, 0, TAU); ctx.fill(); }
  ink(C.near); disc(x, y, r * 0.07);
}
function minaret(x, h, w = 9) {
  box(x, w, h); box(x, w + 8, 5, h * 0.55); box(x, w + 8, 5, h * 0.78);
  poly([[x - w / 2 - 1, h], [x + w / 2 + 1, h], [x, h + 34]]);
}
function skyline(seed, x0, x1, hMin, hMax, t, lit = true) {
  const r = rng(seed); let x = x0;
  while (x < x1) {
    const w = 34 + r() * 60, h = hMin + r() * (hMax - hMin);
    ctx.fillRect(X(x), Y(h), w, h);
    if (lit && h > 40) { const keep = ctx.fillStyle; lights(x + w / 2, 8, w - 10, h - 16, Math.max(2, Math.floor(w / 13)), Math.max(2, Math.floor(h / 15)), seed * 31 + Math.floor(x), t, 2.4); ctx.fillStyle = keep; }
    x += w + 4 + r() * 16;
  }
}

const paint = (c) => { ctx.fillStyle = c; ctx.strokeStyle = c; };
function hills(seed, h0, h1, step = 70) { // a rolling far ridge across the whole city
  const r = rng(seed); const pts = [[-760, 0]];
  for (let x = -760; x <= 760; x += step) pts.push([x, h0 + r() * (h1 - h0)]);
  pts.push([760, 0]);
  ctx.beginPath(); pts.forEach(([x, y], i) => { if (!i) ctx.moveTo(X(x), Y(y)); else { const [px, py] = pts[i - 1]; ctx.quadraticCurveTo(X(px), Y(py), X((px + x) / 2), Y((py + y) / 2)); } });
  ctx.lineTo(X(760), Y(0)); ctx.closePath(); ctx.fill();
}

// ——— the cities ———
const CITIES = {
  London(t, lt) {
    ink(C.mid); skyline(11, -640, 640, 30, 120, t);
    ink(C.near);
    // Palace of Westminster and the Elizabeth Tower
    box(-420, 300, 78); for (let k = 0; k < 9; k++) poly([[-560 + k * 35, 78], [-548 + k * 35, 78], [-554 + k * 35, 104]]);
    box(-250, 46, 250); box(-250, 58, 56, 232); poly([[-279, 288], [-221, 288], [-250, 372]]);
    lights(-420, 10, 280, 56, 20, 3, 5, t);
    glow(0.95); disc(-250, 260, 19); ink(C.near); line([[-250, 260], [-250, 273]], 2); line([[-250, 260], [-241, 256]], 2);
    wheel(60, 196, 172, t, 1, 28);
    // Tower Bridge
    ink(C.near);
    for (const x of [330, 520]) { box(x, 58, 214); poly([[x - 29, 214], [x + 29, 214], [x, 276]]); poly([[x - 29, 214], [x - 21, 214], [x - 25, 246]]); poly([[x + 29, 214], [x + 21, 214], [x + 25, 246]]); }
    box(425, 190, 14, 168); box(425, 190, 8, 150); box(425, 420, 12, 56);
    ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(X(300), Y(200)); ctx.quadraticCurveTo(X(240), Y(80), X(180), Y(62)); ctx.moveTo(X(550), Y(200)); ctx.quadraticCurveTo(X(610), Y(80), X(670), Y(62)); ctx.stroke();
    lights(330, 70, 40, 130, 3, 7, 7, t); lights(520, 70, 40, 130, 3, 7, 8, t);
    // a red double-decker along the embankment
    const bx = -560 + 62 * (lt + TRAVEL);
    paint("#d2202c"); ctx.beginPath(); ctx.roundRect(X(bx - 36), Y(34), 72, 30, 5); ctx.fill();
    paint("rgba(255,236,190,.95)"); for (let k = 0; k < 6; k++) { ctx.fillRect(X(bx - 31 + k * 11), Y(30), 8, 7); if (k < 5) ctx.fillRect(X(bx - 31 + k * 11), Y(18), 8, 7); }
    paint("#0a0a12"); disc(bx - 22, 4, 5); disc(bx + 20, 4, 5);
  },
  Dublin(t, lt) {
    ink(C.far); hills(22, 70, 150);
    // the Poolbeg chimneys, red and white
    for (const x of [-560, -516]) for (let k = 0; k < 10; k++) { paint(k % 2 ? "rgba(236,236,236,.9)" : "rgba(200,50,58,.92)"); ctx.fillRect(X(x - 8 + k * 0.25), Y((k + 1) * 24), 16 - k * 0.5, 24); }
    ink(C.mid); skyline(21, -640, 640, 28, 96, t);
    ink(C.near);
    // the Spire
    poly([[-392, 0], [-380, 0], [-386, 400]]); paint("rgba(120,255,170,.95)"); disc(-386, 398, 3.5); paint("rgba(120,255,170,.18)"); disc(-386, 398, 16);
    // Custom House
    ink(C.near); box(330, 330, 62); box(330, 90, 26, 62); box(330, 56, 44, 88); dome(330, 132, 30, 1.25); box(330, 5, 26, 168);
    lights(330, 10, 310, 40, 22, 2, 23, t);
    // Samuel Beckett Bridge: a harp on its side
    ink(C.near); box(-60, 520, 12, 54);
    ctx.lineWidth = 15; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(X(-200), Y(60)); ctx.quadraticCurveTo(X(-150), Y(280), X(60), Y(330)); ctx.stroke(); ctx.lineCap = "butt";
    ctx.strokeStyle = `rgba(${C.light},.55)`; ctx.lineWidth = 1.2;
    for (let k = 0; k < 22; k++) { const p = k / 21, q = 1 - p; const px = q * q * -200 + 2 * q * p * -150 + p * p * 60, py = q * q * 60 + 2 * q * p * 280 + p * p * 330; ctx.beginPath(); ctx.moveTo(X(px), Y(py)); ctx.lineTo(X(-150 + k * 16), Y(66)); ctx.stroke(); }
    ink(C.near); box(-210, 16, 60); box(180, 14, 56);
  },
  Rotterdam(t, lt) {
    ink(C.mid); skyline(31, -640, 640, 40, 150, t);
    ink(C.near);
    // De Rotterdam: stacked, shifted blocks
    for (const [x, y, w, h] of [[-470, 0, 70, 130], [-455, 130, 70, 120], [-390, 0, 70, 150], [-378, 150, 70, 110], [-312, 0, 70, 120], [-325, 120, 70, 125]]) box(x, w, h, y);
    lights(-392, 10, 220, 240, 16, 15, 33, t, 2.6);
    // Euromast
    ink(C.near); box(330, 16, 250); box(330, 62, 22, 176); poly([[302, 198], [358, 198], [338, 214], [322, 214]]); box(330, 6, 150, 250); glow(0.9); disc(330, 400, 3);
    lights(330, 180, 56, 14, 9, 1, 34, t);
    // Erasmus Bridge: the bent "swan" pylon and its fan of cables
    ink(C.near); box(40, 620, 12, 50);
    poly([[-36, 50], [-8, 50], [-52, 196], [-138, 356], [-158, 350], [-80, 190]]);
    ctx.strokeStyle = `rgba(${C.light},.6)`; ctx.lineWidth = 1.2;
    for (let k = 0; k < 16; k++) { ctx.beginPath(); ctx.moveTo(X(-140 + k * 3.2), Y(350 - k * 9)); ctx.lineTo(X(20 + k * 20), Y(60)); ctx.stroke(); }
    for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.moveTo(X(-146), Y(350 - k * 14)); ctx.lineTo(X(-200 - k * 12), Y(60)); ctx.stroke(); }
    // a windmill, sails turning
    ink(C.near); poly([[430, 0], [484, 0], [470, 104], [444, 104]]); dome(457, 104, 15, 1.1);
    ctx.save(); ctx.translate(X(457), Y(112)); ctx.rotate(TAU * lt / 9);
    for (let k = 0; k < 4; k++) { ctx.rotate(TAU / 4); ctx.fillStyle = C.near; ctx.fillRect(-2, 0, 4, 80); ctx.strokeStyle = `rgba(${C.light},.6)`; ctx.lineWidth = 1; ctx.strokeRect(2, 12, 15, 66); ctx.beginPath(); for (let j = 1; j < 5; j++) { ctx.moveTo(2, 12 + j * 13.2); ctx.lineTo(17, 12 + j * 13.2); } ctx.stroke(); }
    ctx.restore();
    // a container ship heading out
    const sx = 190 - 24 * lt;
    ink(C.near); poly([[sx - 120, 0], [sx + 126, 0], [sx + 110, 20], [sx - 110, 20]]); box(sx + 86, 26, 46, 20);
    const cols = ["#ff7a1a", "#2f7bff", "#e8e8e8", "#e23b3b", "#ffc93f", "#2fb37a"]; const cr2 = rng(35);
    for (let row = 0; row < 3; row++) for (let k = 0; k < 8 - row; k++) { paint(cols[Math.floor(cr2() * cols.length)]); ctx.globalAlpha = 0.9; ctx.fillRect(X(sx - 104 + k * 21 + row * 10), Y(20 + (row + 1) * 11), 19, 10); ctx.globalAlpha = 1; }
    // tulips along the quay
    const tc = ["#ff4d4d", "#ffcf3f", "#ff8a2a", "#ff6fa8"];
    for (let k = 0; k < 44; k++) { const x = -420 + k * 15; if (x > -60 && x < 120) continue; paint("rgba(60,150,90,.9)"); ctx.fillRect(X(x) - 0.75, Y(12), 1.5, 10); paint(tc[k % 4]); ctx.beginPath(); ctx.ellipse(X(x), Y(14), 3.2, 4.4, 0, 0, TAU); ctx.fill(); }
  },
  Milan(t, lt) {
    // the Alps behind the city
    ink(C.far); const ar = rng(42); const peaks = [];
    { const pts = [[-760, 0]]; for (let x = -720; x <= 720; x += 96) { const h = 150 + ar() * 150; pts.push([x - 48, h * 0.55 + ar() * 20], [x, h]); peaks.push([x, h]); } pts.push([760, 0]); poly(pts); }
    paint("rgba(255,255,255,.5)"); for (const [x, h] of peaks) if (h > 200) poly([[x - 16, h - 24], [x - 5, h - 16], [x + 4, h - 26], [x + 15, h - 22], [x, h]]);
    // three beams: green, white, red
    for (const [k, rgb] of [[-1, "0,150,74"], [0, "255,255,255"], [1, "214,48,60"]]) {
      const a = -Math.PI / 2 + k * 0.3 + 0.05 * loop(t, 5, k * 0.3), g2 = ctx.createLinearGradient(X(0), Y(200), X(0) + Math.cos(a) * 560, Y(200) + Math.sin(a) * 560);
      g2.addColorStop(0, `rgba(${rgb},.42)`); g2.addColorStop(1, `rgba(${rgb},0)`); ctx.fillStyle = g2;
      ctx.beginPath(); ctx.moveTo(X(0), Y(200)); ctx.lineTo(X(0) + Math.cos(a - 0.08) * 560, Y(200) + Math.sin(a - 0.08) * 560); ctx.lineTo(X(0) + Math.cos(a + 0.08) * 560, Y(200) + Math.sin(a + 0.08) * 560); ctx.closePath(); ctx.fill();
    }
    ink(C.mid); skyline(41, -640, 640, 34, 110, t);
    ink(C.near);
    // Unicredit Tower and its spire
    poly([[-500, 0], [-430, 0], [-430, 250], [-452, 290], [-500, 270]]); box(-448, 5, 110, 285); lights(-465, 12, 56, 230, 5, 16, 43, t, 2.6);
    // Torre Velasca: wider at the top
    ink(C.near); box(470, 60, 170); box(470, 84, 86, 170); for (const dx of [-36, -12, 12, 36]) line([[470 + dx * 0.8, 150], [470 + dx, 172]], 3); lights(470, 14, 46, 230, 4, 15, 44, t, 2.6);
    // the Duomo
    ink(C.near);
    poly([[-230, 0], [230, 0], [230, 120], [150, 150], [60, 208], [0, 232], [-60, 208], [-150, 150], [-230, 120]]);
    for (let k = -7; k <= 7; k++) { const x = k * 31, base = 232 - Math.abs(k) * 15.5 - (Math.abs(k) > 5 ? 8 : 0), hh = k === 0 ? 150 : 52 + (k % 2 ? 0 : 16); poly([[x - 5, base - 6], [x + 5, base - 6], [x, base + hh]]); }
    for (const x of [-228, 228]) poly([[x - 6, 100], [x + 6, 100], [x, 190]]);
    glow(0.85); disc(0, 384, 3);
    glow(0.8);
    for (const [x, h, y] of [[-170, 46, 18], [-95, 62, 18], [0, 82, 18], [95, 62, 18], [170, 46, 18]]) { ctx.beginPath(); ctx.moveTo(X(x - 13), Y(y)); ctx.lineTo(X(x - 13), Y(y + h - 14)); ctx.quadraticCurveTo(X(x), Y(y + h + 12), X(x + 13), Y(y + h - 14)); ctx.lineTo(X(x + 13), Y(y)); ctx.closePath(); ctx.fill(); }
    glow(0.7); disc(0, 158, 15);
  },
  Istanbul(t, lt) {
    ink(C.mid); skyline(51, -640, 640, 26, 84, t);
    ink(C.near);
    // Galata Tower
    box(-470, 62, 190); box(-470, 74, 12, 176); poly([[-506, 190], [-434, 190], [-470, 282]]); box(-470, 3, 26, 280); lights(-470, 110, 46, 60, 4, 3, 53, t);
    // a great mosque: cascading domes and six minarets
    ink(C.near);
    box(40, 400, 70); box(40, 300, 46, 70); box(40, 190, 40, 116);
    dome(40, 156, 96, 0.92); dome(-92, 116, 58); dome(172, 116, 58); dome(-170, 70, 40); dome(250, 70, 40); dome(-34, 116, 34); dome(114, 116, 34);
    box(40, 4, 26, 244); glow(0.9); disc(40, 272, 3); ink(C.near);
    for (const [x, h] of [[-196, 250], [276, 250], [-128, 330], [208, 330], [-250, 200], [330, 200]]) minaret(x, h);
    lights(40, 14, 380, 40, 26, 2, 54, t); lights(40, 122, 170, 20, 12, 1, 55, t);
    // a ferry on the Bosphorus
    const fx = 420 + 60 * loop(t, 1);
    poly([[fx - 60, 0], [fx + 66, 0], [fx + 54, 16], [fx - 52, 16]]); box(fx, 70, 14, 16); box(fx + 8, 10, 14, 30); lights(fx, 18, 64, 10, 9, 1, 56, t, 2.4);
    // seagulls
